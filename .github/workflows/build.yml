name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [released]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip uv
      - name: Build package
        run: uv build
