# 这是一个配置文件范例.
# 所有账户信息为生成, 请填写您的账户信息.
# 查看帮助与详情: https://emby-keeper.github.io#安装与使用

# ================================================================================
# Emby 保活相关设置
# 详见: https://emby-keeper.github.io/guide/配置文件#emby-子项
# ================================================================================

[emby]

# 每次进行进行 Emby 保活的当日时间范围, 可以为单个时间 ("8:00AM") 或时间范围 ("<8:00AM,10:00AM>"):
time_range = "<11:00AM,11:00PM>"

# 每隔几天进行 Emby 保活:
interval_days = "<7,12>"

# 最大可同时进行的站点数:
concurrency = 1

# 模拟观看的随机时长范围 (秒), 账号未单独配置时使用全局设置:
time = [300, 600]

# 是否校验 HTTPS 证书, 默认 false (自签证书服务器可正常访问):
verify = false

# 默认 Emby 指纹, 账号未单独配置时使用以下值:
client = "Hills"

# 设备与设备 ID: 默认不配置, 程序会自动生成并缓存 (每次安装随机, 避免使用固定值):
# device = "my-device"

# device_id = "my-device-id"


client_version = "1.6.1"

useragent = "Hills/1.6.1 (android; 15)"

# ================================================================================
# Emby 账号, 您可以重复该片段多次以增加多个账号.
# 详见: https://emby-keeper.github.io/guide/配置文件#emby-account-子项
# ================================================================================

[[emby.account]] # 第 1 个账号

# 站点域名和端口:
url = "https://www.buchanan.net:443"

# 用户名和密码:
username = "denise47"
password = "B(1yrz_owJ"

# 以下为进阶配置, 请取消注释 (删除左侧的 #) 以使用:
# 模拟观看的随机时长范围 (秒), 默认使用全局设置 emby.time:
# time = [300, 600]

# 每隔几天进行保活, 默认使用全局设置 emby.interval_days:
# interval_days = "<7,12>"

# 每次进行保活的当日时间范围, 默认使用全局设置 emby.time_range:
# time_range = "<11:00AM,11:00PM>"

# 是否校验 HTTPS 证书, 默认使用全局设置 emby.verify:
# verify = true

# 以下指纹设置默认使用全局 emby.*; 如需单账号覆盖请取消注释:
# client = "Hills"

# device = "my-device"

# device_id = "my-device-id"

# client_version = "1.6.1"

# useragent = "Hills/1.6.1 (android; 15)"

# 无法获取视频长度时, 依然允许播放 (默认最大播放 10 分钟左右, 可能播放超出实际长度):
# allow_stream = true

# 取消注释以不使用配置文件定义的代理进行连接
# use_proxy = false

# 取消注释以禁用该账户
# enabled = false


# ================================================================================
# 代理相关设置
# 代理设置, Emby 将通过此代理连接, 服务器位于国内时请配置代理并取消注释
# 详见: https://emby-keeper.github.io/guide/配置文件#proxy-子项
# ================================================================================

# [proxy]
# hostname = "127.0.0.1"
# port = 1080
# scheme = "socks5" # 可选: http / socks5

# ================================================================================
# 日志推送相关设置
# 详见: https://emby-keeper.github.io/guide/配置文件#notifier-子项
# ================================================================================

[notifier]

# 启用保活结果的日志推送:
enabled = true
# 推送方式, 本分支仅支持 apprise:
method = "apprise"
# Apprise 推送地址, 支持 telegram / email / webhook 等, 详见 apprise 文档:
apprise_uri = "tgram://bot_token/chat_id"


